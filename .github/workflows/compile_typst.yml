name: Compile Typst Documents
on: [push]

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Inter Font
      run: |
        mkdir fonts
        wget https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
        unzip Inter-4.1.zip -d fonts

    - name: Compile Typst Files
      uses: ammar-ahmed22/compile-typst-action@v2
      with:
        source_paths: 'main.typ'
        output_paths: 'output/main.pdf'
        fonts_path: 'fonts'

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: 'output_pdf'
        path: 'output/'

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pdf-${{ github.sha }}
        name: PDF Build ${{ github.sha }}
        files: output/main.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download PDF Artifact
      uses: actions/download-artifact@v4
      with:
        name: output_pdf
        path: output/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
