name: Compile Typst Documents
on: [push]

permissions:
  contents: write
  pages: write
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Inter Font
      run: |
        mkdir fonts
        wget https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
        unzip Inter-4.1.zip -d fonts

    - name: Create output directory
      run: mkdir -p output

    - name: Compile Typst Files
      uses: ammar-ahmed22/compile-typst-action@v2
      with:
        source_paths: 'main.typ'
        output_paths: 'output/REGALA_RESUME.pdf'
        fonts_path: 'fonts'

    - name: Prepare Pages
      run: |
        cat > output/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Resume</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
              }
              embed {
                width: 100%;
                height: 100%;
              }
            </style>
          </head>
          <body>
            <embed src="REGALA_RESUME.pdf" type="application/pdf">
            THIS IS ACTUALLY HTML
          </body>
          </html>
          EOF

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        name: 'github-pages'
        path: 'output/'

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pdf-${{ github.sha }}
        name: REGALA_RESUME
        files: output/REGALA_RESUME.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
